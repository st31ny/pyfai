name: build-pyfai
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Python-Version aus Pipfile
        id: py
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Pipfile','rb'))['requires']['python_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v4
        with: 
          python-version: ${{ steps.py.outputs.version }}
      - name: Debug
        run: python3 --version && which python3
      - name: Install pipenv
        run: pip install pipenv
      - name: Make tests
        run: make test
