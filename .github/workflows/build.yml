name: build-pyfai
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: 
          python-version-file: 'Pipfile'
      - name: Install pipenv
        run: pip install pipenv
      - name: Run tests
        run: make test
      - name: Linting
        run: make pylint
      - uses: actions/upload-artifact@v4
        with: 
          path: |
            build/coverage/*
            build/pylint/*
          retention-days: 7 days
          if-no-files-found: error
          
  build:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: 
          python-version-file: 'Pipfile'
      - name: Install pipenv
        run: pip install pipenv build
      - name: Build
        run: make build
  check:
    runs-on: ubuntu-latest
    needs: test
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: build/
      - uses: actions/setup-python@v7
        with: 
          python-version-file: 'Pipfile'
      - name: Install pipenv
        run: pip install pipenv
      - name: Check
        run: make check
