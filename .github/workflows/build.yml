name: build-pyfai
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Python-Version aus Pipfile
        id: py
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Pipfile','rb'))['requires']['python_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with: 
          python-version: ${{ steps.py.outputs.version }}
      - name: Install pipenv
        run: pip install pipenv
      - name: Run tests
        run: make test
      - name: Linting
        run: make pylint
      - uses: actions/upload-artifact@v7
        with: 
          path: |
            build/coverage/*
            build/pylint/*
          retention-days: 7 days
          
  build:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Python-Version aus Pipfile
        id: py
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Pipfile','rb'))['requires']['python_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with: 
          python-version: ${{ steps.py.outputs.version }}
      - name: Install pipenv
        run: pip install pipenv build
      - name: Build
        run: make build
  check:
    runs-on: ubuntu-latest
    needs: test
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Python-Version aus Pipfile
        id: py
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Pipfile','rb'))['requires']['python_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with: 
          python-version: ${{ steps.py.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: 
      - name: Install pipenv
        run: pip install pipenv
      - name: Check
        run: make check
