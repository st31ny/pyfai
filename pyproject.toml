[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "toml",
    "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "fai"
dynamic = ["version", "dependencies", "optional-dependencies"]
maintainers = {
    {name = "Maximilian Stein", email = "m@steiny.biz"}
}
description = "FAI script integration lib"
readme = "README.rst"
requires-python = ">=3.7"
license = MIT
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/st31ny/pyfai"

[tool.setuptools_scm]
write_to = "fai/_version.py"
tag_regex = "^release/(?P<version>\\d+(\\.\\d+){2})$"
